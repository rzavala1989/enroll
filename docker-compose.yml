# Local infrastructure: the three services the API needs and the README
# never mentioned. Postgres was listed as a prerequisite; Redis and
# Mongo were not, and the API refuses to boot without REDIS_URL, so a
# new contributor's first `pnpm dev:api` failed with a config error
# about a dependency nobody had told them to install.
#
#   pnpm infra:up     start everything
#   pnpm infra:down   stop it
#
# Data lives in named volumes, so a restart keeps your seed.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enroll
      POSTGRES_PASSWORD: enroll
      POSTGRES_DB: enroll
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enroll -d enroll']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly so a queued promotion job survives a container restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  mongo-data:
